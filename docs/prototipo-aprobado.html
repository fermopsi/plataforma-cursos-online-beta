const LOGO=`<svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#308CA2"/><path d="M9 23V9l14 14V9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const art2=c=>{const x=[330,70,300,100][c.id%4];return"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 225'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#001D44'/><stop offset='1' stop-color='#44679B'/></linearGradient><pattern id='p' width='24' height='24' patternUnits='userSpaceOnUse'><path d='M24 0H0V24' fill='none' stroke='#fff' stroke-opacity='.07'/></pattern></defs><rect width='400' height='225' fill='url(#g)'/><rect width='400' height='225' fill='url(#p)'/><circle cx='${x}' cy='50' r='70' fill='#308CA2' fill-opacity='.45'/><g transform='translate(152 64) scale(4)' fill='none' stroke='#fff' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'><path d='${IC[c.cat]||IC.Gestión}'/></g></svg>`)};
const foot=r=>foot0(r)===""?"":`<footer class="foot"><div class="in"><div><b>${LOGO}${aca}</b><p>Cursos online prácticos, con certificado al terminar.</p></div><div><b>Cursos</b><a href="#catalogo">Catálogo</a>${[...new Set(C.map(c=>c.cat))].map(k=>`<a href="#catalogo" onclick="cur.f='${k}';R()">${k}</a>`).join("")}</div><div><b>Contacto</b><a href="https://wa.me/${WA}" target="_blank" rel="noopener">WhatsApp</a><a href="#contacto">Más información</a></div></div><div class="in cp">© 2026 ${aca}</div></footer>`;
V.home=()=>`<section class="h2"><div class="wrap hh"><div><span class="eyebrow">Formación práctica para el mundo digital</span><h1>Aprende nuevas habilidades. Transforma tu futuro.</h1><p class="lead">Formación práctica en negocios digitales, marketing, tecnología e inteligencia artificial.</p><div class="row" style="margin-top:20px"><a class="btn big" href="#catalogo">Explorar cursos</a><a class="btn g big" href="#nosotros">Conocer Aula Norte</a></div></div><div class="himg"><img src="${art(C[0])}" alt="Portada de curso en línea"></div></div></section>
<div class="wrap"><h2>Categorías de formación</h2><div class="grid cats">${[...new Set(C.map(c=>c.cat))].map(k=>`<a class="card cat" href="#catalogo" onclick="cur.f='${k}'">${ic(k,28)}<b>${k}</b><span class="mu">${C.filter(c=>c.cat==k).length} curso(s)</span></a>`).join("")}</div>
<h2 style="margin-top:40px">Cursos destacados</h2><div class="grid">${C.slice(0,3).map(card).join("")}</div>
<h2 style="margin-top:40px">Por qué estudiar en Aula Norte</h2><div class="grid">${[["Pago único","Pagas una vez y conservas el acceso a tu curso."],["Certificado con código","Se emite al terminar las lecciones obligatorias."],["Aprende a tu ritmo","Retoma en la última lección que viste, desde cualquier dispositivo."]].map(b=>`<div class="card ben">${ic("ok")}<b>${b[0]}</b><p class="mu" style="margin:0">${b[1]}</p></div>`).join("")}</div>
<h2 style="margin-top:40px">Cómo funciona la inscripción</h2><div class="grid steps">${["Elige tu curso en el catálogo.","Escríbenos por WhatsApp desde la ficha del curso.","Confirmamos tu pago y habilitamos tu acceso.","Ingresa al aula y comienza a aprender."].map((t,i)=>`<div class="card"><span class="num">${i+1}</span><p>${t}</p></div>`).join("")}</div>
<h2 style="margin-top:40px">Preguntas frecuentes</h2><div class="card"><details><summary><b>¿Cómo me inscribo?</b></summary><p class="mu">Escríbenos por WhatsApp, registra tu pago y habilitamos tu acceso.</p></details><hr style="border:0;border-top:1px solid var(--line)"><details><summary><b>¿Qué métodos de pago aceptan?</b></summary><p class="mu">Efectivo, transferencia bancaria y QR.</p></details></div></div>`;
V.login=()=>`<div class="lg"><div class="lp"><b class="fb">${LOGO}${aca}</b><div><h1>Bienvenido de nuevo</h1><p>Ingresa a tu aula y continúa donde lo dejaste.</p></div><img src="${art(C[1])}" alt=""></div><div class="lf"><form class="f" onsubmit="event.preventDefault();toast('Sesión iniciada (demo)');location.hash='estudiante'"><h2>Ingresar al aula</h2><label class="lb">Correo electrónico<input type="email" autocomplete="email" value="ana@correo.com" required></label><label class="lb">Contraseña<input type="password" autocomplete="current-password" value="12345678" required></label><a class="mu" href="#" onclick="event.preventDefault();toast('Enviamos un enlace de recuperación (demo)')">¿Olvidaste tu contraseña?</a><button class="btn">Ingresar</button><button type="button" class="btn g" onclick="location.hash='admin'">Entrar como administrador (demo)</button></form></div></div>`;
V.nosotros=()=>`<div class="wrap" style="max-width:760px"><h1>Conoce Aula Norte</h1><p class="lead">Somos una academia online enfocada en formación práctica. Cada curso combina clases en video, materiales descargables y un certificado al finalizar.</p><a class="btn" href="#catalogo">Ver cursos</a></div>`;
V.contacto=()=>`<div class="wrap" style="max-width:760px"><h1>Contacto</h1><p class="lead">Escríbenos por WhatsApp para inscribirte o resolver tus dudas.</p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${WA}">Escribir por WhatsApp</a></div>`;
function mark(id){const k=id+"-"+cur.L[0]+"-"+cur.L[1];done.has(k)?done.delete(k):done.add(k);R();const p=prog(id).p;if(p==100){toast("¡Curso completado!");cert(id)}else if(done.has(k)){toast("Lección completada · "+p+"%");step(id,1)}}
function step(id,d){const f=[];mods(id).forEach((m,i)=>m[1].forEach((_,j)=>f.push([i,j])));let n=f.findIndex(x=>x[0]==cur.L[0]&&x[1]==cur.L[1])+d;if(n>=0&&n<f.length){cur.L=f[n];R()}}
function cert(id){modal(`<div class="cert"><div>🎓 ${aca}</div><p>Certifica que</p><h2>Ana Rojas</h2><p>completó el curso <b>${cn(id).t}</b></p><p class="mu">Código: CERT-2026-00${id}7A · 23/11/2026</p></div><div class="row" style="margin-top:12px"><button class="btn" onclick="toast('Descarga PDF simulada')">Descargar PDF</button><button class="btn g" onclick="close()">Cerrar</button></div>`)}
function newCourse(){modal(`<h3>Nuevo curso</h3><div class="f"><input id="nt" placeholder="Título"><input id="np" type="number" placeholder="Precio (Bs)"><button class="btn" onclick="if(!nt.value)return toast('Escribe un título');C.push({id:C.length+1,t:nt.value,cat:'Gestión',ins:'Por asignar',lv:'Básico',h:'—',p:+np.value||0,e:'🆕',d:'Curso en preparación.',draft:true});close();R();toast('Curso creado como borrador')">Crear curso</button></div>`)}
function newStu(){modal(`<h3>Nuevo estudiante</h3><div class="f"><input id="sn" placeholder="Nombre completo"><input id="sm" placeholder="Correo"><button class="btn" onclick="if(!sn.value)return toast('Escribe el nombre');S.push({n:sn.value,m:sm.value,tel:'',c:[],a:'Activo'});close();R();toast('Estudiante creado')">Guardar</button></div>`)}
function newPay(){modal(`<h3>Inscribir y registrar pago</h3><div class="f"><select id="ps">${S.map(s=>`<option>${s.n}</option>`).join("")}</select><select id="pc">${C.map(c=>`<option value="${c.id}">${c.t}</option>`).join("")}</select><input id="pv" type="number" placeholder="Importe (Bs)"><select id="pm"><option>Efectivo</option><option>Transferencia</option><option>QR</option></select><select id="pt"><option>Pagado</option><option>Parcial</option><option>Pendiente</option></select><button class="btn" onclick="const s=S.find(x=>x.n==ps.value),c=+pc.value;P.unshift({s:s.n,c,v:+pv.value||cn(c).p,f:'2026-11-23',mt:pm.value,st:pt.value});if(!s.c.includes(c))s.c.push(c);close();R();toast('Inscripción y pago registrados')">Confirmar</button></div>`)}
function R(keep){const h=location.hash.slice(1)||"home";const[r,a]=h.split("-");const f=V[r]||V.home;const x=r=="estudiante"||r=="aula"?1:0;if(r!="aula")cur.L=cur.L;const html=nav(r)+f(+a||1)+foot(r);const fo=keep&&document.activeElement.id=="q";document.getElementById("app").innerHTML=NOEMO(html);if(fo){const q=document.getElementById("q");q.focus();q.setSelectionRange(99,99)}}
addEventListener("hashchange",()=>{window.scrollTo(0,0);R()});
addEventListener("keydown",e=>{const m=location.hash.match(/^#aula-(\d+)/);if(m&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key=="ArrowRight")step(+m[1],1);if(e.key=="ArrowLeft")step(+m[1],-1)}});R();
</script></body></html>
